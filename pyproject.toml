[project]
name = "open-civic-agenda-scrapers"
version = "0.1.0"
description = "Scrapers that produce Open Civic Agenda meeting records from municipal data sources."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "jsonschema>=4.20",
]

[tool.setuptools.packages.find]
include = ["scrapers*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
